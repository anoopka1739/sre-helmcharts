ingress-nginx:
  controller:
    extraArgs:
      default-ssl-certificate: "nginx-ingress/wildcard-tls-secret"
    ingressClassResource:
      # -- Name of the IngressClass
      name: nginx
      # -- Create the IngressClass or not
      enabled: true
      ingressClass: nginx
      resources:
        limits:
          cpu: 200m
          memory: 180Mi
        requests:
          cpu: 100m
          memory: 90Mi
      service:
       # -- Enable controller services or not. This does not influence the creation of either the admission webhook or the metrics service.
        enabled: true
        type: LoadBalancer
        annotations:
          # Tells AWS to provision a modern Layer 4 Network Load Balancer (NLB)
          service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
          # Ensures internal AWS traffic routes correctly across availability zones
          service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
