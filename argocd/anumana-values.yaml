argo-cd:
  global:
    domain: myargocd.learnsrebyanoop.com

  configs:
    secret:
      createSecret: true
      argocdServerAdminPassword: "$2y$05$TSOulLL6dRkAjsw6V.zwvuJ8g9rxyPINhDV5p14VyiDHxD.iwv/RC"
  controller:
    replicas: 1
  dex:
    enabled: true
    resources:
      limits:
        cpu: 50m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 32Mi
  redis:
    enabled: true
  redis-ha:
    enabled: false
  server:
    replicas: 1
    extraArgs:
      - --insecure
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        #nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
      hostname: "myargocd.learnsrebyanoop.com"
      path: /
      pathType: Prefix
      # Notice there is no secretName here anymore
      tls:
        - hosts:
            - myargocd.learnsrebyanoop.com
  repoServer:
    replicas: 1    
  applicationSet:
    replicas: 1
  notifications:
    enabled: false